name: Build Desktop Installers (.exe & .dmg)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional GitHub Release tag to attach built installers to (e.g. v3.5.0)"
        required: false
        default: ""
      skip_macos:
        description: "Skip macOS .dmg build when only Windows .exe/.zip is needed"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-dmg:
    name: Build macOS Apple Silicon (.dmg)
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_macos) }}
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MicroRing Studio & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]" pillow pyinstaller

      - name: Run 12-Suite Verification Tests
        run: python tests/test_microring_all.py

      - name: Build & Smoke-Test macOS .app + .dmg
        run: python -m microring.build_standalone --target macos

      - name: Upload macOS .dmg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicroRing-Studio-macOS-DMG
          path: dist/*.dmg

      - name: Attach .dmg to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: dist/*.dmg

  build-windows-exe:
    name: Build Windows 10/11 Setup (.exe) & Portable (.zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MicroRing Studio & PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]" pillow pyinstaller

      - name: Run 12-Suite Verification Tests
        shell: pwsh
        run: python tests/test_microring_all.py

      - name: Build & Smoke-Test Windows Setup .exe + Portable .zip
        shell: pwsh
        run: python -m microring.build_standalone --target windows-cpu

      - name: Upload Windows .exe & .zip Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MicroRing-Studio-Windows-Installer
          path: |
            dist/*Setup*.exe
            dist/*Portable*.zip

      - name: Attach .exe & .zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            dist/*Setup*.exe
            dist/*Portable*.zip
