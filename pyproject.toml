[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "openmrr-studio"
version = "3.2.0"
description = "License-free conversational photonics microring designer (Visible 400 nm to Mid-IR 14 um): 2D full-vector Maxwell eigenmodes, spatial/temporal CMT, lab spectrum fitting, bidirectional GDSII layout bridge, and token-minimal AI agent MCP — without Lumerical, RSoft, or COMSOL."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Zhihao Ren" },
]
requires-python = ">=3.11"
keywords = [
  "integrated-photonics",
  "microring-resonator",
  "eigenmode-solver",
  "coupled-mode-theory",
  "gdsii",
  "silicon-photonics",
  "silicon-nitride",
  "silicon-carbide",
  "lithium-niobate",
  "visible-photonics",
  "mid-infrared",
  "mcp-server",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-fem>=10.0",
  "shapely>=2.0",
  "lmfit>=1.3",
  "gdstk>=0.9.50",
  "starlette>=0.38",
  "uvicorn>=0.30",
  "anyio>=4.4",
  "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/ZhihaoRenKevin/openmrr-studio"
Repository = "https://github.com/ZhihaoRenKevin/openmrr-studio"
Documentation = "https://github.com/ZhihaoRenKevin/openmrr-studio#readme"
Issues = "https://github.com/ZhihaoRenKevin/openmrr-studio/issues"
Author-ORCID = "https://orcid.org/0000-0002-2520-0784"

[project.optional-dependencies]
desktop = [
  "pywebview>=5.0",
]
fde = [
  "tidy3d>=2.6",
]
gdsfactory = [
  "gdsfactory>=8.0",
]
cuda = [
  "torch>=2.3",
]
apple = [
  "mlx>=0.16; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "torch>=2.3",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
]

[project.scripts]
openmrr = "openmrr.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/openmrr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
