name: Build Desktop Installers (.exe & .dmg)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos-dmg:
    name: Build macOS Apple Silicon (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenMRR Studio & PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]" pillow pyinstaller

      - name: Run 10-Suite Verification Tests
        run: python tests/test_openmrr_all.py

      - name: Build & Smoke-Test macOS .app + .dmg
        run: python -m openmrr.build_standalone --target macos

      - name: Upload macOS .dmg Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenMRR-Studio-macOS-DMG
          path: dist/*.dmg

      - name: Attach .dmg to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg

  build-windows-exe:
    name: Build Windows 10/11 Setup (.exe) & Portable (.zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OpenMRR Studio & PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop]" pillow pyinstaller

      - name: Build & Smoke-Test Windows Setup .exe + Portable .zip
        shell: pwsh
        run: python -m openmrr.build_standalone --target windows-cpu

      - name: Upload Windows .exe & .zip Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenMRR-Studio-Windows-Installer
          path: |
            dist/*Setup*.exe
            dist/*Portable*.zip

      - name: Attach .exe & .zip to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*Setup*.exe
            dist/*Portable*.zip
