[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "microring-studio"
version = "3.5.0"
description = "License-free Photonic IC and Microring Resonator CAD (Visible 400 nm to Mid-IR 14 um): instant High-Q convergence (10^4 to 10^8+), 2D vector Maxwell eigenmodes, Butt/Edge couplers, 2D-FDFD surface grating couplers, 2D-FEM TO/EO/Si-PN modulators, GDSII masks, and Ansys Lumerical INTERCONNECT export without Lumerical MODE/FDTD, COMSOL, or RSoft."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Zhihao Ren" },
]
requires-python = ">=3.11"
keywords = [
  "photonic-ic",
  "optical-interconnect",
  "integrated-photonics",
  "microring-resonator",
  "grating-coupler",
  "edge-coupler",
  "butt-coupler",
  "high-q-resonator",
  "eigenmode-solver",
  "fdfd",
  "coupled-mode-theory",
  "gdsii",
  "klayout",
  "lumerical-interconnect",
  "silicon-photonics",
  "silicon-nitride",
  "silicon-carbide",
  "lithium-niobate",
  "mcp-server",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "scikit-fem>=10.0",
  "shapely>=2.0",
  "lmfit>=1.3",
  "gdstk>=0.9.50",
  "starlette>=0.38",
  "uvicorn>=0.30",
  "anyio>=4.4",
  "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/ZhihaoRenKevin/microring-studio"
Repository = "https://github.com/ZhihaoRenKevin/microring-studio"
Documentation = "https://github.com/ZhihaoRenKevin/microring-studio#readme"
Issues = "https://github.com/ZhihaoRenKevin/microring-studio/issues"
Author-ORCID = "https://orcid.org/0000-0002-2520-0784"

[project.optional-dependencies]
desktop = [
  "pywebview>=5.0",
]
fde = [
  "tidy3d>=2.6",
]
gdsfactory = [
  "gdsfactory>=8.0",
]
cuda = [
  "torch>=2.3",
]
apple = [
  "mlx>=0.16; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "torch>=2.3",
]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
]

[project.scripts]
microring = "microring.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/microring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
