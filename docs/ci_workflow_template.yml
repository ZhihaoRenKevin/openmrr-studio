name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Full Physics, GDS & MCP Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv & Python 3.12
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install OpenMRR Studio & test dependencies
        run: uv sync --extra dev

      - name: Run 9-suite verification (FEM, CMT, Multi-Band, GDSII, Copilot, MCP)
        run: uv run python tests/test_openmrr_all.py
